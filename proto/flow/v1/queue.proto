syntax = "proto3";

package flow.v1;


// QueuePeerService is the inter-pod gRPC service for the Federated Queue Mesh.
// Each HITL node replica runs a QueuePeerService server alongside its
// NodeService on the same gRPC port. Peers discover each other via headless
// service DNS and use this service for scatter-gather reads and proxy writes.
//
service QueuePeerService {
  // Returns queue items from this shard's local queue.db.
  // Used by scatter-gather reads to collect items across all shards.
  rpc GetLocalQueue(GetLocalQueueRequest) returns (GetLocalQueueResponse);

  // Claims a waiting item on the local shard.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist on this shard.
  // Returns QUEUE_ITEM_ALREADY_CLAIMED if the item is already claimed.
  rpc ClaimItem(ClaimItemRequest) returns (ClaimItemResponse);

  // Releases a claimed item back to waiting on the local shard.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist.
  // Returns QUEUE_ITEM_INVALID_STATE if the item is not claimed.
  rpc ReleaseItem(ReleaseItemRequest) returns (ReleaseItemResponse);

  // Deletes a claimed item from the local shard (decision made).
  // The queue is a parking lot — decided items are removed, not marked.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist.
  // Returns QUEUE_ITEM_INVALID_STATE if the item is not claimed.
  rpc DecideItem(DecideItemRequest) returns (DecideItemResponse);

  // Replicates an item to this shard as a backup copy. The owning shard calls
  // this after Enqueue so exactly one backup holds the item for failover.
  rpc ReplicateItem(ReplicateItemRequest) returns (ReplicateItemResponse);

  // Drops a backup copy of an item. Carries the generation UUID so a missed or
  // raced drop can never destroy a newer parking event's copy.
  rpc DropItem(DropItemRequest) returns (DropItemResponse);

  // Notifies this shard that another shard of the queue is dead (lease
  // eviction). The receiver fires its promotion path for any backup rows it
  // holds owned by the dead shard.
  rpc NotifyShardDead(NotifyShardDeadRequest) returns (NotifyShardDeadResponse);

  // Applies a broadcast write (generation-guarded apply) to this shard's
  // local store. The queue-service fans ApplyItem out to every living shard
  // as the single serialized write funnel; each shard CAS-applies only if the
  // carried generation supersedes its current one (see QueueItem.generation_id).
  rpc ApplyItem(ApplyItemRequest) returns (ApplyItemResponse);
}

// GetLocalQueueRequest specifies filtering and pagination for queue list queries.
message GetLocalQueueRequest {
  // Filter by status: "waiting", "claimed", or empty for all.
  string status = 1;
  // Maximum number of items to return. 0 = default 100.
  int32 limit = 2;
  // Pagination offset.
  int32 offset = 3;
}

// GetLocalQueueResponse is a paginated list of queue items.
message GetLocalQueueResponse {
  repeated QueueItem items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
  // Serve-side tie-break tag: the shard_id that served this response. On
  // scatter-gather reads the queue-service aggregates the same copy from every
  // shard; this field lets it break ties deterministically by which shard
  // served each item (R-3.6 owner tie-break).
  string served_by_shard_id = 5;
}

// QueueItem represents a Workitem parked in the HITL queue.
// The Workitem ID is the primary key — there is a 1:1 mapping between
// queue entries and Workitems. The queue stores parking state only;
// domain-specific data lives in artefacts/feedback via the Archivist.
message QueueItem {
  // Primary key — the Workitem this queue entry tracks.
  string workitem_id = 1;
  // Owning pod identity (e.g., "review-queue-0").
  string shard_id = 2;
  // Queue name scoping (e.g., "hitl-arbiter"). Defaults to FLOW_NODE_ID.
  string queue_name = 6;
  // Queue status: "waiting" or "claimed".
  string status = 3;
  // RFC3339 timestamp when the item was enqueued.
  string enqueued_at = 4;
  // RFC3339 timestamp when the item was claimed. Empty if not claimed.
  string claimed_at = 5;
  // Generation UUID disambiguating distinct parking events of the same
  // workitem. Stale backup copies are superseded by a newer generation.
  string generation_id = 7;
  // True when this copy is a backup held on a non-owning shard. Owner copy
  // = false. Routing (findOwner/routeGetItem) matches owner rows only.
  bool is_backup = 8;
  // Choices is the item's metadata (R-5.2): the routing choices the caller
  // supplied at enqueue time. Populated via the Enqueue request; the
  // queue-service serves them generically in item reads. Empty when the
  // item was enqueued without choices or the caller did not supply any.
  repeated string choices = 9;
}

message ClaimItemRequest {
  string workitem_id = 1;
}

message ClaimItemResponse {
  QueueItem item = 1;
}

message ReleaseItemRequest {
  string workitem_id = 1;
}

message ReleaseItemResponse {
  QueueItem item = 1;
}

message DecideItemRequest {
  string workitem_id = 1;
  // The human's routing choice. Empty string if no choice is associated
  // (e.g. hitl-appraise which uses a fixed output).
  string choice = 2;
}

message DecideItemResponse {
  bool acknowledged = 1;
}

// ReplicateItemRequest carries a full QueueItem to be stored as a backup copy
// on the receiving shard.
message ReplicateItemRequest {
  QueueItem item = 1;
}

message ReplicateItemResponse {
  bool acknowledged = 1;
}

// ApplyItemRequest carries a full QueueItem to be applied (generation-guarded
// CAS) on the receiving shard. Carries workitem_id, generation_id, owner
// shard_id, status, timestamps, and choices so a shard can apply the write
// exactly as the queue-service's serialized funnel issued it.
message ApplyItemRequest {
  QueueItem item = 1;
}

message ApplyItemResponse {
  bool acknowledged = 1;
}

// DropItemRequest drops a backup copy of an item. generation_id guards against
// a missed/raced drop destroying a newer parking event's copy.
message DropItemRequest {
  string workitem_id = 1;
  string generation_id = 2;
}

message DropItemResponse {
  bool acknowledged = 1;
}

// NotifyShardDeadRequest notifies a surviving shard that the named shard of
// the queue is dead (lease eviction), triggering its promotion path.
message NotifyShardDeadRequest {
  string shard_id = 1;
}

message NotifyShardDeadResponse {
  bool acknowledged = 1;
}

// QueueRegistryService is the queue-service's own gRPC surface: queue
// registration, lease/heartbeat, deregistration, listing, and single-item
// internal operations. Each HITL node replica registers its queue+shard and
// heartbeats against it when FLOW_QUEUE_SERVICE_ADDR is set.
service QueueRegistryService {
  // Registers a shard of a queue with the queue-service.
  rpc RegisterQueue(RegisterQueueRequest) returns (RegisterQueueResponse);
  // Idempotent lease/heartbeat upsert. The response carries the queue's current
  // living shard set so each shard refreshes its local "who else is alive" view.
  rpc HeartbeatQueue(HeartbeatQueueRequest) returns (HeartbeatQueueResponse);
  // Deregisters a shard on clean shutdown.
  rpc DeregisterQueue(DeregisterQueueRequest) returns (DeregisterQueueResponse);
  // Lists the registered queues and their living shards.
  rpc ListQueues(ListQueuesRequest) returns (ListQueuesResponse);
  // Cancels a specific queued item for an internal caller.
  rpc CancelQueuedItem(CancelQueuedItemRequest) returns (CancelQueuedItemResponse);
  // Decides a specific queued item for an internal caller.
  rpc DecideQueuedItem(DecideQueuedItemRequest) returns (DecideQueuedItemResponse);
}

message RegisterQueueRequest {
  string queue_name = 1;
  string shard_id = 2;
  string shard_addr = 3;
}

message RegisterQueueResponse {
  bool acknowledged = 1;
}

message HeartbeatQueueRequest {
  string queue_name = 1;
  string shard_id = 2;
  string shard_addr = 3;
}

// HeartbeatQueueResponse carries the queue's current living shard set so each
// shard learns its candidate backup set on every beat, without cluster access.
message HeartbeatQueueResponse {
  bool acknowledged = 1;
  repeated ShardRegistration shards = 2;
}

message DeregisterQueueRequest {
  string queue_name = 1;
  string shard_id = 2;
}

message DeregisterQueueResponse {
  bool acknowledged = 1;
}

message ListQueuesRequest {}

message ListQueuesResponse {
  repeated QueueRegistration queues = 1;
}

// QueueRegistration is one registered queue and its living shards.
message QueueRegistration {
  string queue_name = 1;
  repeated ShardRegistration shards = 2;
}

// ShardRegistration mirrors the Queue CR .status.shards[] shape. phase is a
// free string on the wire ("active"/"evicted") vs the CRD's Enum; timestamp is
// an RFC3339 string on the wire vs metav1.Time in the CRD.
message ShardRegistration {
  string shard_id = 1;
  string shard_addr = 2;
  string last_heartbeat_at = 3;
  string phase = 4;
}

message CancelQueuedItemRequest {
  string queue_name = 1;
  string workitem_id = 2;
}

message CancelQueuedItemResponse {
  bool acknowledged = 1;
}

message DecideQueuedItemRequest {
  string queue_name = 1;
  string workitem_id = 2;
  string choice = 3;
}

message DecideQueuedItemResponse {
  bool acknowledged = 1;
}

// EnqueueRequest parks a Workitem in the queue. The caller supplies the
// workitem_id, the queue_name it belongs to, and its choices (R-5.2) —
// the routing choices served to the human when the item is reviewed. Choices
// ride on this request so the queue-service persists them as item metadata at
// enqueue time (per the choices-resolution decision).
message EnqueueRequest {
  string workitem_id = 1;
  string queue_name = 2;
  repeated string choices = 3;
}

message EnqueueResponse {
  bool acknowledged = 1;
}

// QueueGatewayService is the SDK-facing gRPC surface for queue operations.
// This is deliberately a SIBLING of QueueRegistryService, not an addition to
// it: QueueRegistryService is the queue-service's internal registration/lease
// surface (RegisterQueue/HeartbeatQueue/...), whereas this service is the
// stable public contract the SDK's thin QueueManager client (PHASE_04) and the
// write funnel (PHASE_03) compile against. Keeping the two concerns in separate
// services preserves cohesion and lets the internal registry surface evolve
// without churning the client-facing contract. Each HITL node replica points
// its QueueManager at this service when FLOW_QUEUE_SERVICE_ADDR is set.
//
// ERROR MAPPING CONTRACT (pinned here, consumed by PHASE_03/04/07):
//   - item not found            -> QUEUE_ITEM_NOT_FOUND
//         gRPC NotFound (5)               -> HTTP 404
//   - already claimed / invalid state     -> QUEUE_ITEM_ALREADY_CLAIMED /
//                                           QUEUE_ITEM_INVALID_STATE
//         gRPC AlreadyExists (6) / FailedPrecondition (9) -> HTTP 409
//   - quorum not reached        -> QUEUE_UNAVAILABLE
//         gRPC Unavailable (14)          -> HTTP 503
// The RPC names and shapes match the SDK QueueManager method set (R-1.3):
// Enqueue/GetGlobalQueue/GetItem/Claim/Release/Decide.
service QueueGatewayService {
  // Parks a Workitem in the queue with the caller's choices.
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  // Returns every item in the queue, optionally filtered by status.
  rpc GetGlobalQueue(GetGlobalQueueRequest) returns (GetGlobalQueueResponse);
  // Returns a single item by queue_name + workitem_id.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist.
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  // Claims a waiting item.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist.
  // Returns QUEUE_ITEM_ALREADY_CLAIMED if the item is already claimed.
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  // Releases a claimed item back to waiting.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist.
  // Returns QUEUE_ITEM_INVALID_STATE if the item is not claimed.
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  // Decides a claimed item (removes it from the queue) and records the choice.
  // Returns QUEUE_ITEM_NOT_FOUND if the item does not exist.
  // Returns QUEUE_ITEM_INVALID_STATE if the item is not claimed.
  rpc Decide(DecideRequest) returns (DecideResponse);
}

message GetGlobalQueueRequest {
  string queue_name = 1;
  // Optional status filter ("waiting", "claimed"); empty for all.
  string status = 2;
}

message GetGlobalQueueResponse {
  repeated QueueItem items = 1;
}

message GetItemRequest {
  string queue_name = 1;
  string workitem_id = 2;
}

message GetItemResponse {
  QueueItem item = 1;
}

message ClaimRequest {
  string queue_name = 1;
  string workitem_id = 2;
}

message ClaimResponse {
  QueueItem item = 1;
}

message ReleaseRequest {
  string queue_name = 1;
  string workitem_id = 2;
}

message ReleaseResponse {
  QueueItem item = 1;
}

message DecideRequest {
  string queue_name = 1;
  string workitem_id = 2;
  // The human's routing choice. Empty string if no choice is associated
  // (e.g. hitl-appraise which uses a fixed output).
  string choice = 3;
}

message DecideResponse {
  bool acknowledged = 1;
}
