syntax = "proto3";

package flow.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";

// CartographerService is the Active Knowledge Graph service for Foundry Flow.
// It provides a typed, queryable, persistent knowledge graph backed by LadybugDB
// and a git-backed versioning system.
service CartographerService {
  // --- Read Path (Node-Facing) ---
  rpc ExecuteCypher(ExecuteCypherRequest) returns (ExecuteCypherResponse);
  rpc SearchNeighbors(SearchNeighborsRequest) returns (SearchNeighborsResponse);
  rpc FullTextSearch(FullTextSearchRequest) returns (FullTextSearchResponse);
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);

  // --- Write Path (Node-Facing) ---
  rpc CreateEntity(CreateEntityRequest) returns (CreateEntityResponse);
  rpc UpdateEntity(UpdateEntityRequest) returns (UpdateEntityResponse);
  rpc DeleteEntity(DeleteEntityRequest) returns (DeleteEntityResponse);
  rpc CreateEdge(CreateEdgeRequest) returns (CreateEdgeResponse);
  rpc DeleteEdge(DeleteEdgeRequest) returns (DeleteEdgeResponse);

  // --- Transaction Path (Node-Facing) ---
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);
  rpc RefreshTransaction(RefreshTransactionRequest) returns (RefreshTransactionResponse);
  rpc GetTransactionDiff(GetTransactionDiffRequest) returns (GetTransactionDiffResponse);
  rpc ExtendTimeout(ExtendTimeoutRequest) returns (ExtendTimeoutResponse);

  // --- Service-Facing (Operator -> Cartographer) ---
  rpc ApplySchema(ApplySchemaRequest) returns (ApplySchemaResponse);
  rpc WipeGraph(WipeGraphRequest) returns (WipeGraphResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // --- Administrative Path (Node-Facing) ---
  rpc Sync(SyncRequest) returns (SyncResponse);
  rpc ExportGraph(ExportGraphRequest) returns (stream ExportGraphResponse);
}

// --- Read Path Messages ---

message ExecuteCypherRequest {
  string cypher = 1;
  google.protobuf.Value params = 2;
  string transaction_id = 3;
}

// Row represents a single row of string values from a Cypher query result.
// Each Row is one flat tuple of the returned column values, in the order
// LadybugDB returns them (SPEC R2). Values are string-typed in v1: all
// properties are `type: string` per R1.
message Row {
  repeated string values = 1;
}

message ExecuteCypherResponse {
  repeated Row rows = 1;
}

message SearchNeighborsRequest {
  repeated float embedding = 1;
  string entity_type = 2;
  int32 top_k = 3;
  string transaction_id = 4;
}

message SearchNeighborsResponse {
  repeated SearchNeighborResult results = 1;
}

message SearchNeighborResult {
  string entity_id = 1;
  string entity_type = 2;
  map<string, string> properties = 3;
  // distance is the raw LadybugDB cosine distance between the query embedding
  // and this result's embedding — LOWER is more similar, and results are
  // ordered ascending by distance. It is a distance, not a similarity score:
  // consumers must not order by it descending expecting higher-is-better.
  double distance = 4;
}

message FullTextSearchRequest {
  string query = 1;
  string entity_type = 2;
  string transaction_id = 3;
}

message FullTextSearchResponse {
  repeated Entity results = 1;
}

message ListEntitiesRequest {
  string entity_type = 1;
  int32 page_size = 2;
  string page_token = 3;
  string transaction_id = 4;
}

message ListEntitiesResponse {
  repeated Entity entities = 1;
  string next_page_token = 2;
}

// --- Write Path Messages ---

message CreateEntityRequest {
  string entity_type = 1;
  string id = 2;
  map<string, string> properties = 3;
  repeated float embedding = 4;
  string transaction_id = 5;
}

message CreateEntityResponse {
  string entity_id = 1;
  string entity_type = 2;
  map<string, string> properties = 3;
  repeated float embedding = 4;
}

message UpdateEntityRequest {
  string id = 1;
  map<string, string> properties = 2;
  repeated float embedding = 3;
  string transaction_id = 4;
}

message UpdateEntityResponse {
  string entity_id = 1;
  string entity_type = 2;
  map<string, string> properties = 3;
  repeated float embedding = 4;
}

message DeleteEntityRequest {
  string id = 1;
  string transaction_id = 2;
}

message DeleteEntityResponse {
  string entity_id = 1;
  string entity_type = 2;
  map<string, string> properties = 3;
  repeated float embedding = 4;
}

message CreateEdgeRequest {
  string edge_type = 1;
  string from_entity_id = 2;
  string to_entity_id = 3;
  map<string, string> properties = 4;
  string transaction_id = 5;
}

message CreateEdgeResponse {
  string edge_id = 1;
  string edge_type = 2;
  string from_entity_id = 3;
  string to_entity_id = 4;
  map<string, string> properties = 5;
}

message DeleteEdgeRequest {
  string id = 1;
  string transaction_id = 2;
}

message DeleteEdgeResponse {
  string edge_id = 1;
  string edge_type = 2;
  string from_entity_id = 3;
  string to_entity_id = 4;
  map<string, string> properties = 5;
}

// --- Transaction Path Messages ---

message BeginTransactionRequest {
  google.protobuf.Duration timeout = 1;
}

message BeginTransactionResponse {
  string transaction_id = 1;
  google.protobuf.Duration applied_timeout = 2;
}

message CommitTransactionRequest {
  string transaction_id = 1;
  bool ack = 2;  // When true, Commit blocks until the sync worker pushes to remote.
}

message CommitTransactionResponse {}

message RollbackTransactionRequest {
  string transaction_id = 1;
}

message RollbackTransactionResponse {}

message RefreshTransactionRequest {
  string transaction_id = 1;
}

message RefreshTransactionResponse {}

message GetTransactionDiffRequest {
  string transaction_id = 1;
}

message GetTransactionDiffResponse {
  repeated DiffEntry added_entities = 1;
  repeated DiffEntry modified_entities = 2;
  repeated DiffEntry deleted_entities = 3;
  repeated DiffEntry added_edges = 4;
  repeated DiffEntry modified_edges = 5;
  repeated DiffEntry deleted_edges = 6;
}

message DiffEntry {
  string id = 1;
  string type = 2;
  map<string, string> properties = 3;
  bool suspected = 4;
  repeated float embedding = 5;
  string from_entity_id = 6;
  string to_entity_id = 7;
}

message ExtendTimeoutRequest {
  string transaction_id = 1;
  google.protobuf.Duration duration = 2;
}

// ExtendTimeoutResponse returns the timeout the server applied. The server
// applies the requested duration verbatim (rejecting an extension that would
// exceed the 7-day hard maximum with INVALID_ARGUMENT), so applied_timeout
// equals the granted duration; it mirrors BeginTransaction's applied_timeout
// so the SDK surfaces what the server granted rather than assuming it.
message ExtendTimeoutResponse {
  // The timeout, in total, actually applied to the transaction, matching the
  // granted request duration. Present whenever the extension is accepted.
  google.protobuf.Duration applied_timeout = 1;
}

// --- Reusable Entity Type ---

message Entity {
  string entity_id = 1;
  string entity_type = 2;
  map<string, string> properties = 3;
  repeated float embedding = 4;
}

// --- Schema Messages (Service-Facing) ---

message Schema {
  repeated EntityType entity_types = 1;
  repeated EdgeType edge_types = 2;
}

message EntityType {
  string name = 1;
  repeated Property properties = 2;
  bool enable_vector_index = 3;
  // Connection rules governing edges from this entity type.
  // Multiple rules are OR-ed — if *any* rule permits the connection, the edge
  // is allowed. Within a single rule, see ConnectionRule documentation for
  // the AND semantics between can_connect_to and using.
  // An empty or omitted rules list means this entity type permits no edges
  // (every CreateEdge from this source is rejected with PERMISSION_DENIED).
  repeated ConnectionRule rules = 4;
}

message EdgeType {
  string name = 1;
  repeated Property properties = 2;
}

message Property {
  string name = 1;
  string type = 2;
  bool required = 3;
}

// ConnectionRule defines a single rule entry in an entity type's connection policy.
// Rule composition semantics (from FoundryGraph CRD spec R1):
//   - Multiple entries in the parent `rules` list are OR-ed: if *any* rule permits
//     the connection, the edge is allowed.
//   - Within a single rule, BOTH `can_connect_to` AND `using` must be satisfied
//     (AND semantics between the two lists).
//   - Within each list, matching is by membership (implicit OR) — the target matches
//     if it equals any entry in the list.
//   - An empty `can_connect_to` or `using` list makes this rule permanently
//     unsatisfiable (rejected at ApplySchema time).
//   - Only the source entity type's rules are evaluated; the target's rules play
//     no role in edge authorization.
message ConnectionRule {
  // Target entity types that the source entity type may connect to.
  // Membership check (implicit OR): the edge's target type must match any entry.
  repeated string can_connect_to = 1;
  // Edge types that may be used for the connection.
  // Membership check (implicit OR): the edge's type must match any entry.
  repeated string using = 2;
}

message ApplySchemaRequest {
  Schema schema = 1;
}

message ApplySchemaResponse {}

message WipeGraphRequest {}

message WipeGraphResponse {}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool ladybug_ok = 1;
  bool schema_applied = 2;
  bool pvc_writable = 3;
}

// --- Administrative Path Messages ---

message SyncRequest {}

message SyncResponse {}

message ExportGraphRequest {
  string format = 1;
}

message ExportGraphResponse {
  bytes chunk = 1;
}
