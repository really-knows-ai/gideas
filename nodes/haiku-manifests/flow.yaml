# Haiku Foundry Cycle — Flow Configuration
#
# This defines the hello-world Foundry Cycle for haiku creation with Sort as the
# central routing hub. Every node feeds back to Sort, which triages governance
# state and routes accordingly.
#
# Topology:
#   Forge ──[default]──→ Sort ──[quench]──→ Quench ──[default]──→ Sort
#                         │──[appraisal]──→ Appraisal ──[default]──→ Sort
#                         │                  └──[fan-out]──→ Appraiser(s) ──[Complete]──┘
#                         │──[refine]────→ Refine ──[default]───→ Sort
#                         └──Complete() (exit)
#
# Sort's decision tree:
#   1. Missing "appraisal" stamp?         → route to Appraisal
#   2. Missing attestation stamps (law-*)?→ match ATTEST: capability (see matching algo in spec)
#      - lawgrp-<group> stamps need a node with ATTEST:.../law-group
#      - law-<lawID>-<type> stamps need a node with ATTEST:.../law-id
#      - Both are satisfied by ATTEST:.../law-* (catch-all)
#      - First node in nodeOrder whose ATTEST: capability matches wins
#   3. Unresolved feedback?               → route to Refine
#   4. Missing "approval" stamp?          → route to hitl-approval
#   5. All clear?                         → Complete()
#
# Stamp vocabulary vs exit contract:
#   - The GovernedArtefact stamp vocabulary is an ARCHIVIST WRITE GATE — it
#     controls what stamps the Archivist will accept when a node writes a
#     stamp via StampArtefact(). The wildcard "law-*" in the vocabulary tells
#     the Archivist "accept any stamp matching law-*", but it does NOT create
#     a completion requirement.
#   - The FoundryFlow exit contract is a SORT COMPLETION GATE — it lists stamps
#     that must be present before the artefact can exit the Flow. Only non-law
#     stamps are listed here (e.g., "appraisal", "approval").
#   - Laws with `appliesTo: ["haiku"]` AUTOMATICALLY become implicit completion
#     requirements via the platform's VerifyLawAttestations check. The platform
#     queries the Librarian for applicable laws, computes the required
#     attestation stamps (law-<lawID>-<type> or lawgrp-<group>), and verifies
#     they are present before allowing Complete(). No exit contract changes
#     are needed when adding a new law — it is automatic.
#   - Group mode (bundle vs law-by-law) determines stamp granularity:
#     - Bundle mode: one lawgrp-<group> stamp covers the entire group.
#     - Law-by-law mode: each passing law's representation type produces a
#       law-<lawID>-<type> stamp; once all laws pass, group.Attest() stamps
#       lawgrp-<group> as an aggregate.
#
# Artefacts:
#   - petition: The creative brief, pre-populated at workitem creation.
#   - haiku: The governed output, must carry [appraisal, law-*, approval].
#   - review-data: Internal data transfer between Appraisal and Appraiser children.
#
# Apply order:
#   1. kubectl apply -f flow.yaml          (this file)
#   2. kubectl apply -f configmaps.yaml    (node configuration)
#   3. kubectl apply -f workitem.yaml      (trigger the cycle)
---
apiVersion: flow.foundry.io/v1
kind: GovernedArtefact
metadata:
  name: haiku
  namespace: haiku-flow
spec:
  stamps:
    - appraisal
    - law-*
    - approval
---
apiVersion: flow.foundry.io/v1
kind: GovernedArtefact
metadata:
  name: petition
  namespace: haiku-flow
spec:
  stamps:
    - approval
---
apiVersion: flow.foundry.io/v1
kind: GovernedArtefact
metadata:
  name: review-data
  namespace: haiku-flow
spec:
  stamps: []
---
apiVersion: flow.foundry.io/v1
kind: FoundryFlow
metadata:
  name: haiku-flow
  namespace: haiku-flow
spec:
  entryContracts:
    # The petition must exist when the workitem enters the flow.
    standard-entry:
      "petition": []
  exitContracts:
    # The haiku must carry appraisal and approval stamps to exit.
    # Law attestation stamps are implicit from laws with appliesTo: ["haiku"]
    # and are enforced by the platform's VerifyLawAttestations check.
    standard-exit:
      "haiku":
        - appraisal
        - approval
  nodeGroups:
    main-cycle:
      nodes:
        - forge
        - sort
        - quench
        - appraisal
        - appraiser
        - refine
        - hitl-arbiter
        - hitl-approval
  governancePolicy:
    maxVisits: 20
    defaultTimeout: "10m"
    maxTimeout: "30m"
---
# --- Node Definitions (Topology) ---

apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: forge
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: forge:latest
  entry: "standard-entry"
  outputs:
    - name: "default"
      target: "sort"
  capabilities:
    - "READ:artefact"
    - "WRITE:artefact/haiku"
    - "READ:law"
---
apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: sort
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: sort:latest
  exit: "standard-exit"
  outputs:
    - name: "quench"
      target: "quench"
    - name: "appraisal"
      target: "appraisal"
    - name: "refine"
      target: "refine"
    - name: "hitl-arbiter"
      target: "hitl-arbiter"
    - name: "hitl-approval"
      target: "hitl-approval"
  capabilities:
    - "READ:artefact"
    - "READ:artefact/haiku"
    - "READ:feedback"
    - "READ:flow"
    - "READ:law"
    - "WRITE:feedback/deadlocked"
---

apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: quench
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: haiku-quench:latest
  outputs:
    - name: "default"
      target: "sort"
  capabilities:
    - "READ:artefact"
    - "READ:artefact/haiku"
    - "READ:feedback"
    - "WRITE:feedback/new"
    - "ATTEST:artefact/haiku/law-id"
---
apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: appraisal
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: appraisal:latest
  outputs:
    - name: "default"
      target: "sort"
  capabilities:
    - "READ:artefact"
    - "READ:artefact/petition"
    - "READ:artefact/haiku"
    - "WRITE:artefact/review-data"
    - "READ:feedback"
    - "READ:law"
    - "WRITE:feedback/new"
    - "WRITE:feedback/resolved"
    - "WRITE:feedback/rejected"
    - "ATTEST:artefact/haiku/appraisal"
    - "ATTEST:artefact/haiku/law-*"
    - "CREATE:workitem/child"
---
apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: appraiser
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: appraiser:latest
  outputs: []
  capabilities:
    - "READ:artefact"
    - "READ:artefact/review-data"
    - "WRITE:artefact/review-data"
---
apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: refine
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: refine:latest
  outputs:
    - name: "default"
      target: "sort"
  capabilities:
    - "READ:artefact"
    - "READ:artefact/petition"
    - "READ:artefact/haiku"
    - "WRITE:artefact/haiku"
    - "READ:feedback"
    - "WRITE:feedback/actioned"
    - "WRITE:feedback/wont_fix"
    - "READ:law"
---
apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: hitl-arbiter
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: hitl-arbiter:latest
  exit: "standard-exit"
  outputs:
    - name: "accept"
      target: "sort"
    - name: "reject"
      target: "sort"
  capabilities:
    - "READ:artefact/haiku"
    - "READ:artefact/petition"
    - "READ:feedback"
    - "WRITE:feedback/link-ruling"
    - "STAMP:artefact/haiku/arbitrated"
---
apiVersion: flow.foundry.io/v1
kind: FoundryNode
metadata:
  name: hitl-approval
  namespace: haiku-flow
  labels:
    flow.foundry.io/flow-name: haiku-flow
spec:
  image: hitl:latest
  exit: "standard-exit"
  outputs:
    - name: "approve"
      target: "sort"
  capabilities:
    - "READ:artefact/haiku"
    - "READ:artefact/petition"
    - "STAMP:artefact/haiku/approval"
