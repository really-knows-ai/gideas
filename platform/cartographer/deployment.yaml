apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cartographer-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # The Deployment below references serviceAccountName: cartographer. In the
  # Operator path this ServiceAccount is created by the Operator (SPEC R6 step 2);
  # this reference template defines it so a standalone `kubectl apply` schedules
  # the pod instead of failing with "serviceaccount not found".
  name: cartographer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartographer
  labels:
    app: cartographer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartographer
  template:
    metadata:
      labels:
        app: cartographer
    spec:
      serviceAccountName: cartographer
      # terminationGracePeriodSeconds must exceed the in-process shutdown budget so the
      # durability teardown finishes before kubelet SIGKILLs. waitForShutdown (cmd/main.go)
      # budgets 30s for GrpcServerGracefulStop, then performs durability teardown afterwards
      # (StopGC, dbStore.Close, git RestoreMain/CleanUntracked). 100s gives that trailing
      # git/LADYBUGDB durability phase ~70s beyond the drain. If this field falls below the
      # 30s GracefulStop budget, a slow drain consumes the whole window and the
      # durability/git-restore steps are SIGKILLed mid-write — keep this > 30s.
      terminationGracePeriodSeconds: 100
      # The image runs as non-root USER 65532:65532 (see Dockerfile). fsGroup==65532
      # makes the mounted PVC group-owned and writable by 65532, and runAsUser/runAsGroup
      # mirror the Dockerfile USER so the container identity matches the volume ownership.
      # Without this, a PVC provisioned root-owned (hostpath / EBS static PVs) is unwritable
      # from UID 65532 and `main.lbug`/`graph-repo/` creation fails at startup (main.go:76,81).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: cartographer
          # ponytail: cartographer:latest is a reference-only placeholder. The
          # actual image is sourced from the Operator's CARTOGRAPHER_IMAGE env var
          # (SPEC R6 step 3); the Operator overrides this field when it renders the
          # real Deployment from the FoundryGraph CRD. This template value is the
          # second source of truth — a manual deploy of this YAML without the
          # Operator would run a stale/imaginary tag. Ceiling: two places that must
          # not drift. Upgrade path: drop the image tag and require CARTOGRAPHER_IMAGE
          # (or move this template behind the values that render it) once manual
          # deploys are no longer supported.
          image: cartographer:latest
          ports:
            - containerPort: 50051
              name: grpc
          # ponytail: the grpc port is hardcoded to 50051 here, in CARTOGRAPHER_PORT,
          # in the readinessProbe, and in the ClusterIP Service targetPort. Changing
          # CARTOGRAPHER_PORT alone orphans the probe and Service ports, so probes start
          # failing and traffic silently misroutes until all four are updated together.
          # In production the Operator renders the real Deployment from the FoundryGraph
          # CRD (SPEC R6 step 3), so a port change also requires the Operator's
          # Deployment template to update all four surfaces (containerPort,
          # CARTOGRAPHER_PORT env, readinessProbe port, and Service targetPort);
          # the drift surface is wider than the four hand-written values in this
          # template alone. Ceiling: one more hardcoded value every time the port is
          # retyped, across both this template and the Operator's rendered Deployment.
          # Upgrade path: derive probe/Service ports from a single source (e.g.
          # ProcessOpen grafana-style port constant or a values param) once the port
          # must vary.
          env:
            - name: LADYBUG_DB_PATH
              # ponytail: "/data" here is one of four copies of the database
              # path that must stay in sync: (1) this Deployment env value,
              # (2) the main.go getEnv("LADYBUG_DB_PATH", "/data") fallback
              # (platform/cartographer/cmd/main.go), (3) this template's
              # volumeMount mountPath "/data" (below), and (4) the
              # Operator-rendered Deployment's PVC mount path, which sets
              # LADYBUG_DB_PATH to the mount path per SPEC R6 step 3
              # (foundrygraph_infra.go hardcodes "/data" on both the env and
              # the MountPath). The env value and the mount path are only
              # accidentally coupled: changing the mountPath without the env
              # change silently opens a fresh database on the wrong mount —
              # main.lbug/graph-repo/ get created at the old path while PVC
              # writes land at the new one, and the next boot finds an empty
              # graph with no error. Ceiling: four typed literals with no
              # single source of truth or compile-time guard. Upgrade path:
              # hoist the path to one shared constant (or a shared annotation)
              # read by this template and the Operator, so a mount-path change
              # is one edit, not four.
              value: /data
            - name: CARTOGRAPHER_PORT
              value: "50051"
            - name: TRANSACTION_TIMEOUT
              # ponytail: "30m" here is one of five copies of the transaction-
              # timeout default that must stay in sync: (1) this Deployment env,
              # (2) the main.go getEnv("TRANSACTION_TIMEOUT", "30m") fallback
              # (platform/cartographer/cmd/main.go), (3) the SPEC R5 default
              # `versioning.transactionTimeout: 30m` (plans/cartographer/SPEC.md),
              # (4) the Operator's rendered-env fallback "30m"
              # (platform/operator/internal/controller/foundrygraph_infra.go), and
              # (5) the CRD-level kubebuilder default `+kubebuilder:default="30m"`
              # (platform/operator/api/v1/foundrygraph_types.go). Changing the
              # default in any one place silently diverges the others: a manual
              # deploy of this template that edits only the SPEC or only main.go
              # ends up enforcing a different timeout than documented, and a
              # deployment that omits this env silently falls back to main.go's
              # hardcoded default. Ceiling: five typed literals with no single
              # source of truth or compile-time guard. Upgrade path: hoist the
              # default to one shared constant (e.g. versioning config) read by
              # all surfaces, so a change is one edit, not five.
              value: "30m"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_VERIFICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: cartographer-operator-key
                  key: key
            - name: SIDECAR_VERIFICATION_KEY
              valueFrom:
                secretKeyRef:
                  name: cartographer-sidecar-key
                  key: key
            # Optional:
            # - name: REMOTE_URL
            #   value: ""
            # - name: REMOTE_AUTH_SECRET_REF
            #   value: ""
            # - name: EVENT_BUS_ADDRESS
            #   value: ""
            # - name: CAPABILITY_STALENESS_WINDOW
            #   value: "30s"
            #   # ponytail: "30s" here is one of five copies of the capability
            #   # staleness-window default that must stay in sync: (1) this
            #   # commented Optional entry, (2) the main.go
            #   # parseDurationEnv("CAPABILITY_STALENESS_WINDOW", "30s") fallback
            #   # (platform/cartographer/cmd/main.go), (3) the SPEC R5 default
            #   # `30s` (plans/cartographer/SPEC.md), (4) the Operator's
            #   # runtime config fallback "30s" (foundrygraph_infra.go), which
            #   # renders this env from the CRD per SPEC R6 step 3, and (5) the
            #   # Operator binary's own default `capabilityStalenessWindow = "30s"`
            #   # (platform/operator/cmd/main.go). Changing the
            #   # default in any one place silently diverges the others: a
            #   # Cartographer pod that omits this env falls back to main.go's
            #   # hardcoded default, so the anti-replay window enforced at the
            #   # Cartographer drifts from the SPEC's and from whatever the
            #   # Operator configures — a stale signature that should be rejected
            #   # may be accepted (or vice versa) with no error. Like REMOTE_PULL_ON_INIT
            #   # below, this entry is commented out on purpose because the Operator
            #   # renders the real Deployment from the CRD; a manual deploy that
            #   # wants a non-default window must uncomment it, and that value then
            #   # becomes another copy to keep in sync. Ceiling: five typed literals
            #   # with no single source of truth or compile-time guard. Upgrade path:
            #   # hoist the default to one shared constant read by all surfaces.
            # - name: REMOTE_PULL_ON_INIT
            #   value: "false"
            #   # ponytail: REMOTE_PULL_ON_INIT is a CRD-owned knob (SPEC R6 step 3
            #   # sets it from `versioning.remote.pullOnInit`, default false) and
            #   # read via parseBoolEnv (cmd/main.go). This template omits it on
            #   # purpose because the Operator renders the real Deployment from the
            #   # CRD; but a *manual* deploy of this file that wants pull-on-init
            #   # cannot turn it on here and silently falls back to main.go's default
            #   # of false (no REMOTE clone/catch-up on init). Ceiling: three copies
            #   # of the default (SPEC R5, main.go parseBoolEnv default, this note)
            #   # that must stay in sync. Upgrade path: uncomment this entry with the
            #   # desired value when manually deploying, or let the Operator render
            #   # it from the CRD so there is a single source of truth.
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cartographer-data
---
apiVersion: v1
kind: Service
metadata:
  # cartographer-<fg-name>, conventionally cartographer-flow-graph (SPEC R5):
  # a manual deploy must be reachable at the SPEC-mandated discovery DNS
  # cartographer-<fg-name>.<namespace>.svc.cluster.local, which is also what the
  # Operator renders as the Service name (foundrygraph_infra.go cartographerServiceName).
  name: cartographer-flow-graph
spec:
  selector:
    app: cartographer
  ports:
    - port: 50051
      targetPort: grpc
      name: grpc
  type: ClusterIP
