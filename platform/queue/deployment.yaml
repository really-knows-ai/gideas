# Queue-Service Deployment for Foundry Flow
#
# The queue-service provides a unified REST frontend for all QueueManager
# instances in a namespace. It discovers shards via DNS, proxies every
# operation via gRPC QueuePeerService, and stores no queue state locally.
#
# Prerequisites:
#   - Build queue-service image: docker build -t flow-queue-service:latest -f platform/queue/Dockerfile .
#
# For Kind cluster:
#   kind load docker-image flow-queue-service:latest --name <cluster>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-queue-service
  namespace: default
  labels:
    app.kubernetes.io/name: flow-queue-service
    app.kubernetes.io/part-of: foundry-flow
    app.kubernetes.io/component: data-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-queue-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flow-queue-service
    spec:
      containers:
        - name: queue-service
          image: flow-queue-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUEUE_NAMES
              value: "human-arbiter,human-approval"
            - name: FLOW_NAMESPACE
              value: "default"
            - name: QUEUE_SERVICE_PORT
              value: "8080"
            - name: QUEUE_PEER_PORT
              value: "50053"
---
apiVersion: v1
kind: Service
metadata:
  name: flow-queue-service
  namespace: default
  labels:
    app.kubernetes.io/name: flow-queue-service
    app.kubernetes.io/part-of: foundry-flow
spec:
  selector:
    app.kubernetes.io/name: flow-queue-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
