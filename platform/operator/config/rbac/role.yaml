  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - flow.foundry.io
  resources:
  - codificationservices/finalizers
  - flowsupportservices/finalizers
  - foundryflows/finalizers
  - foundrygraphs/finalizers
  - foundrynodes/finalizers
  - governedartefacts/finalizers
  - lawgroups/finalizers
  - laws/finalizers
  - treaties/finalizers
  - workitems/finalizers
  verbs:
  - update
- apiGroups:
  - flow.foundry.io
  resources:
  - codificationservices/status
  - flowsupportservices/status
  - foundryflows/status
  - foundrygraphs/status
  - foundrynodes/status
  - governedartefacts/status
  - lawgroups/status
  - laws/status
  - treaties/status
  - workitems/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
