---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: queues.flow.foundry.io
spec:
  group: flow.foundry.io
  names:
    kind: Queue
    listKind: QueueList
    plural: queues
    singular: queue
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: |-
          Queue is the Schema for the queues API. One Queue CR exists per registered
          queue; the queue-service maintains its shards + status as the durable,
          etcd-backed registry (R-B7).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Queue
            properties:
              queueName:
                description: queueName is the name of the queue this registry entry
                  tracks.
                minLength: 1
                type: string
            required:
            - queueName
            type: object
          status:
            description: status defines the observed state of Queue
            properties:
              shards:
                description: shards are the living shards of this queue, one entry
                  per registered shard.
                items:
                  description: QueueShardStatus defines the observed state of a single
                    shard of the queue.
                  properties:
                    addr:
                      description: addr is the host:port address the shard serves
                        its QueuePeerService on.
                      type: string
                    lastHeartbeatAt:
                      description: lastHeartbeatAt is the RFC3339 timestamp of the
                        shard's most recent heartbeat.
                      format: date-time
                      type: string
                    phase:
                      description: 'phase is the shard''s lease phase: "active" or
                        "evicted".'
                      enum:
                      - active
                      - evicted
                      type: string
                    shardID:
                      description: shardID is the owning pod identity of the shard.
                      type: string
                  required:
                  - addr
                  - shardID
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
